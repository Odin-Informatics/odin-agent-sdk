[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odin-agent-sdk"
version = "0.1.0"
description = "Official Python SDK for Odin AI Models, Intelligent Agents, and Enterprise Workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Odin Informatics Engineering Team", email = "dev@odinbilisim.com" },
]
keywords = [
    "odin",
    "ai",
    "llm",
    "agent",
    "rag",
    "sdk",
    "machine-learning",
    "artificial-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.urls]
Homepage = "https://odinbilisim.com"
Documentation = "https://github.com/Odin-Informatics/odin-agent-sdk#readme"
Repository = "https://github.com/Odin-Informatics/odin-agent-sdk"
Issues = "https://github.com/Odin-Informatics/odin-agent-sdk/issues"
