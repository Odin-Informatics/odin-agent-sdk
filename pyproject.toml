[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odin-agent-sdk"
version = "0.3.0"
description = "Experimental, minimal tool-calling agent loop for OpenAI-compatible chat APIs (no hosted service)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Odin Bilişim", email = "info@odinbilisim.com" },
]
keywords = [
    "odin",
    "ai",
    "llm",
    "agent",
    "rag",
    "sdk",
    "machine-learning",
    "artificial-intelligence",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/odin_agent"]

[project.urls]
Homepage = "https://odinbilisim.com"
Documentation = "https://github.com/Odin-Informatics/odin-agent-sdk#readme"
Repository = "https://github.com/Odin-Informatics/odin-agent-sdk"
Issues = "https://github.com/Odin-Informatics/odin-agent-sdk/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
